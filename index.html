<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルタイマー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>タイマー</h1>
    <div id="display">00:30</div>
    <div class="settings">
      <label><input type="number" id="minutesInput" min="0" max="99" value="0">分</label>
      <label><input type="number" id="secondsInput" min="0" max="59" value="30">秒</label>
    </div>
    <div class="buttons">
      <button id="startBtn">スタート</button>
      <button id="stopBtn">停止</button>
      <button id="resetBtn">リセット</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
